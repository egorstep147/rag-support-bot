[project]
name = "support"
version = "0.1.0"
description = "ИИ-поддержка для бизнеса в Telegram и на сайте: RAG по базе знаний, гибридный поиск, evals, операторы в темах группы"
readme = "README.md"
authors = [
    { name = "Egor Stepanov", email = "egorstep147@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "asyncpg>=0.32.0",
    "chatgpt-md-converter>=0.3.12",
    "fastapi>=0.150.0",
    "google-auth>=2.62.0",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
support = "support.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

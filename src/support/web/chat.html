<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поддержка</title>
<style>
  :root { --accent: #2481cc; --bg: #fff; --bg2: #f2f3f5; --text: #1d1d1f; --hint: #8a8a8e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --bg2: #2c2c2e; --text: #f2f2f7; --hint: #8e8e93; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; }
  header { background: var(--accent); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  header b { flex: 1; font-size: 16px; }
  header button { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; line-height: 1; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .assistant, .operator { align-self: flex-start; background: var(--bg2); border-bottom-left-radius: 4px; }
  .operator::before { content: '👩‍💼 Оператор'; display: block; font-size: 12px; color: var(--hint); margin-bottom: 2px; }
  .msg a { color: inherit; }
  .assistant a { color: var(--accent); }
  .rate { display: flex; gap: 6px; margin-top: 6px; }
  .rate button { background: none; border: 1px solid #8884; border-radius: 10px; cursor: pointer; padding: 2px 8px; }
  .rate button.on { background: var(--accent); border-color: var(--accent); }
  .typing { align-self: flex-start; color: var(--hint); font-size: 13px; }
  .bar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #8883; }
  textarea { flex: 1; resize: none; border: 1px solid #8885; border-radius: 12px; padding: 10px; font: inherit; height: 44px;
             background: var(--bg); color: var(--text); outline: none; }
  textarea:focus { border-color: var(--accent); }
  .send { width: 44px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; }
  .op { margin: 0 14px 8px; background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; align-self: flex-start; }
</style>
</head>
<body>
<header><b id="title">Поддержка</b><button id="close" aria-label="Закрыть">×</button></header>
<div id="log"></div>
<button class="op" id="op" hidden>🙋 Позвать оператора</button>
<div class="bar"><textarea id="input" placeholder="Напишите вопрос…" maxlength="2000"></textarea>
  <button class="send" id="send" aria-label="Отправить">➤</button></div>
<script>
const log = document.getElementById('log'), input = document.getElementById('input')
let token = null, last = 0, busy = false

// Токен сессии храним в этом браузере: вернулся на сайт — видит свою переписку
function stored(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v) } catch (e) { return null } }

async function api(path, body) {
  const r = await fetch('/api/web' + path, { method: body ? 'POST' : 'GET', body: body && JSON.stringify(body),
    headers: { 'Content-Type': 'application/json', 'X-Session': token || '' } })
  const data = await r.json().catch(() => ({}))
  if (r.status === 401 && path !== '/session') { stored('support-token', ''); token = null; await ensureSession(); return api(path, body) }
  if (!r.ok) throw new Error(data.detail || 'Ошибка сети')
  return data
}

async function ensureSession() {
  token = stored('support-token')
  if (!token) { token = (await api('/session', {})).token; stored('support-token', token) }
}

function add(m) {
  if (m.id && m.id <= last) return
  if (m.id) last = m.id
  const div = document.createElement('div')
  div.className = 'msg ' + m.role
  div.innerHTML = m.html  // HTML собирает и очищает сервер (safe_html)
  if (m.role === 'assistant' && m.id) {
    const rate = document.createElement('div')
    rate.className = 'rate'
    for (const [v, t] of [[1, '👍'], [-1, '👎']]) {
      const b = document.createElement('button'); b.textContent = t
      b.onclick = () => api('/rate', { message_id: m.id, value: v }).then(() => {
        rate.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on')
      })
      rate.appendChild(b)
    }
    div.appendChild(rate)
  }
  log.appendChild(div)
  log.scrollTop = log.scrollHeight
}

function note(text) { add({ role: 'assistant', html: text.replace(/</g, '&lt;') }) }

async function send() {
  const text = input.value.trim()
  if (!text || busy) return
  busy = true; input.value = ''
  add({ role: 'user', html: text.replace(/&/g, '&amp;').replace(/</g, '&lt;') })
  const typing = document.createElement('div'); typing.className = 'typing'; typing.textContent = 'Печатает…'
  log.appendChild(typing); log.scrollTop = log.scrollHeight
  try {
    const r = await api('/message', { text })
    if (r.message) add(r.message)
  } catch (e) { note('⚠️ ' + e.message) }
  typing.remove(); busy = false; input.focus()
}

input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() } })
document.getElementById('send').onclick = send
document.getElementById('close').onclick = () => parent.postMessage('support:close', '*')
document.getElementById('op').onclick = async () => { try { note((await api('/operator', {})).text) } catch (e) { note('⚠️ ' + e.message) } }

;(async () => {
  const cfg = await (await fetch('/api/web/config')).json()
  document.title = cfg.title
  document.getElementById('title').textContent = cfg.title
  document.documentElement.style.setProperty('--accent', cfg.accent)
  document.getElementById('op').hidden = !cfg.operators
  await ensureSession()
  const history = await api('/messages')
  if (!history.length) note(cfg.welcome)
  history.forEach(add)
  // Ответы оператора приходят опросом раз в 4 секунды
  // (свои сообщения уже на экране — из опроса берём только ответы)
  setInterval(async () => {
    if (!busy) (await api('/messages?after=' + last).catch(() => [])).filter(m => m.role !== 'user').forEach(add)
  }, 4000)
})()
</script>
</body>
</html>

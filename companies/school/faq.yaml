- q: Подойдёт ли курс без опыта программирования?
  a: Да, курсы «Python-разработчик», «Аналитик данных» и «Frontend-разработчик» рассчитаны на новичков. Для курса по ИИ-агентам нужно базовое знание Python.
- q: Сколько времени в неделю нужно на учёбу?
  a: В среднем 8–10 часов в неделю.
- q: Можно ли учиться с телефона?
  a: Смотреть уроки — да, через приложение. Писать код удобнее на компьютере.
- q: Как связаться с куратором?
  a: В личном кабинете есть чат с куратором, по будням отвечает с 10:00 до 19:00 по Москве.

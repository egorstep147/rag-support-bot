# Частые вопросы: точные короткие ответы. Сюда же попадают ответы операторов кнопкой «📚 В FAQ»
- q: Как узнать номер договора?
  a: Номер договора указан в договоре и в личном кабинете на главной странице. Также его подскажет оператор по номеру телефона, указанному в договоре.
- q: Как войти в личный кабинет?
  a: Личный кабинет — lk.volna.example. Логин — номер договора, пароль приходит в SMS при подключении. Забыли пароль — нажмите «Восстановить», новый придёт по SMS.
- q: Есть ли ограничение трафика?
  a: Нет, все тарифы безлимитные.
- q: Можно ли подключиться без договора на год?
  a: Да, договор бессрочный, без минимального срока. Расторгнуть можно в любой момент.
- q: Работаете ли вы с юридическими лицами?
  a: Да, для офисов есть отдельные тарифы. Оставьте заявку — менеджер по корпоративным клиентам свяжется в течение дня.
- q: Как отключить автоплатёж?
  a: В личном кабинете → «Оплата» → «Автоплатёж» → «Отключить». Привязанная карта удалится.
- q: Есть ли скидки пенсионерам?
  a: Да, пенсионерам и людям с инвалидностью — скидка 20% на тарифы «Старт» и «Турбо» при предъявлении удостоверения в офисе.
- q: Где находится офис?
  a: Офис обслуживания — Петропавловск-Камчатский, пр. Победы, 1, работает с 9:00 до 20:00 по будням и с 10:00 до 17:00 в субботу.
